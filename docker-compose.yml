services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: viagem_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: parcel_db
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  importer:
    image: ghcr.io/osgeo/gdal:ubuntu-small-latest
    depends_on:
      - db
    volumes:
      - ./data:/data
    command: bash /data/import.sh

volumes:
  postgis_data: